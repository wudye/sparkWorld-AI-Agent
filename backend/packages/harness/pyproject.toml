[project]
name = "spark-harness"
version = "0.1.0"
description = "spark ai agent harness"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
]
[project.optional-dependencies]
ollama = ["langchain-ollama>=0.3.0"]
pymupdf = ["pymupdf4llm>0.0.17"]
postgres = [
    "asyncpg>=0.29",
    "langgraph-checkpoint-postgres>=0.3.0",
    "psycopg[binary]>=3.3.3",
    "psycopg-pool>3.3.0",
]

[build-system]
requires = ["hatchling"]       
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["spark"]
